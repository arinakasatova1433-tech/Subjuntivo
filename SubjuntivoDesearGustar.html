<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjuntivo – gustos y deseos</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Roboto, system-ui, sans-serif; background: #f7f3f0; color: #2d2a2a; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 900px; width: 100%; background: white; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.12); padding: 30px 35px; margin-bottom: 30px; }
        h1 { font-size: 2rem; font-weight: 600; color: #b34a4a; border-bottom: 3px solid #f0d6d6; padding-bottom: 12px; margin-bottom: 25px; }
        .exercise { background: #faf8f7; border-radius: 18px; padding: 20px 25px; margin: 20px 0 10px 0; border: 1px solid #e6dbd8; }
        .exercise label { display: block; font-weight: 500; margin: 12px 0 4px 0; color: #3d2e2e; }
        .exercise input[type="text"] {
            width: 180px;
            padding: 10px 14px;
            border: 2px solid #ddd2cf;
            border-radius: 12px;
            font-size: 1rem;
            background: white;
            transition: 0.2s;
            display: inline-block;
        }
        .exercise input[type="text"]:focus {
            outline: none;
            border-color: #b34a4a;
            box-shadow: 0 0 0 3px rgba(179,74,74,0.15);
        }
        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .input-wrapper label {
            flex: 1;
            min-width: 200px;
            margin: 0;
        }
        .input-wrapper input {
            flex: 0 0 180px;
        }
        .check-icon {
            font-size: 1.5rem;
            line-height: 1;
            min-width: 30px;
            text-align: center;
            transition: 0.2s;
        }
        .btn {
            background: #b34a4a;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.15s;
            margin-top: 18px;
            margin-right: 12px;
            box-shadow: 0 4px 8px rgba(179,74,74,0.25);
        }
        .btn:hover { background: #9e3d3d; transform: scale(1.02); }
        .btn-secondary {
            background: #6c5b5b;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
        }
        .btn-secondary:hover { background: #554747; }
        .feedback {
            margin-top: 18px;
            padding: 15px 20px;
            border-radius: 14px;
            background: #f0ecea;
            border-left: 6px solid #b34a4a;
            font-size: 0.95rem;
            line-height: 1.6;
            display: none;
        }
        .feedback.show { display: block; }
        .feedback .answer-row {
            padding: 3px 0;
            border-bottom: 1px solid #ddd2cf;
        }
        .feedback .answer-row:last-child { border-bottom: none; }
        .feedback .correct { color: #1f7a3a; font-weight: 500; }
        .feedback .wrong { color: #b34a4a; font-weight: 500; }
        .feedback .highlight-answer { font-weight: 600; color: #2d2a2a; }
        .grammar-input { margin-bottom: 14px; }
        @media (max-width: 600px) {
            .input-wrapper { flex-direction: column; align-items: stretch; }
            .input-wrapper input { flex: 1; width: 100%; }
            .check-icon { align-self: flex-start; margin-top: 5px; }
        }
        .highlight-verb { background: #fce3d6; padding: 0 4px; border-radius: 4px; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎯 Subjuntivo con <span class="highlight-verb">desear, querer, preferir, gustar, molar, molestar, chiflar</span></h1>
    <div class="exercise">
        <p><em>Вставьте форму <strong>presente de subjuntivo</strong> глагола в скобках. Все предложения выражают желания, предпочтения или эмоции.</em></p>

        <div id="subj-container">
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>1. Deseo que tú <strong>(ser)</strong> más sincero.</label>
                    <input type="text" id="subj1">
                    <span class="check-icon" id="icon-subj1"></span>
                </div>
            </div>
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>2. Quiero que ella <strong>(venir)</strong> a la fiesta.</label>
                    <input type="text" id="subj2">
                    <span class="check-icon" id="icon-subj2"></span>
                </div>
            </div>
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>3. Prefiero que él <strong>(tratar)</strong> bien a los demás.</label>
                    <input type="text" id="subj3">
                    <span class="check-icon" id="icon-subj3"></span>
                </div>
            </div>
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>4. Me gusta que ellos <strong>(entender)</strong> mis sentimientos.</label>
                    <input type="text" id="subj4">
                    <span class="check-icon" id="icon-subj4"></span>
                </div>
            </div>
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>5. Me mola que nosotros <strong>(aprender)</strong> a perdonar.</label>
                    <input type="text" id="subj5">
                    <span class="check-icon" id="icon-subj5"></span>
                </div>
            </div>
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>6. Me molesta que ella <strong>(tener)</strong> siempre razón.</label>
                    <input type="text" id="subj6">
                    <span class="check-icon" id="icon-subj6"></span>
                </div>
            </div>
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>7. Me chifla que tú <strong>(permitir)</strong> que nadie te ridiculice.</label>
                    <input type="text" id="subj7">
                    <span class="check-icon" id="icon-subj7"></span>
                </div>
            </div>
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>8. Quiero que <strong>(hablar)</strong> claro. (tú)</label>
                    <input type="text" id="subj8">
                    <span class="check-icon" id="icon-subj8"></span>
                </div>
            </div>
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>9. Prefiero que <strong>(poder)</strong> olvidar el pasado. (él)</label>
                    <input type="text" id="subj9">
                    <span class="check-icon" id="icon-subj9"></span>
                </div>
            </div>
            <div class="grammar-input">
                <div class="input-wrapper">
                    <label>10. Deseo que tú <strong>(hacer)</strong> eso.</label>
                    <input type="text" id="subj10">
                    <span class="check-icon" id="icon-subj10"></span>
                </div>
            </div>
        </div>

        <button class="btn" onclick="checkSubjuntivo()">🎮 Проверить</button>
        <button class="btn btn-secondary" onclick="showAllAnswers()">📖 Показать все правильные ответы</button>
        <div id="subj-feedback" class="feedback"></div>
    </div>
</div>

<script>
    // Правильные ответы
    const correctForms = {
        subj1: 'seas',
        subj2: 'venga',
        subj3: 'trate',
        subj4: 'entiendan',
        subj5: 'aprendamos',
        subj6: 'tenga',
        subj7: 'permitas',
        subj8: 'hables',
        subj9: 'pueda',
        subj10: 'hagas'
    };

    // Функция проверки (только галочки/крестики, без показа правильных ответов)
    function checkSubjuntivo() {
        const feedback = document.getElementById('subj-feedback');
        let total = Object.keys(correctForms).length;
        let correctCount = 0;
        let html = '<div class="feedback show"><strong>🎯 Результаты проверки:</strong><br>';

        for (const [id, correctVal] of Object.entries(correctForms)) {
            const input = document.getElementById(id);
            const icon = document.getElementById('icon-' + id);
            const user = input.value.trim().toLowerCase();
            const isCorrect = user === correctVal;

            // Обновляем иконку
            if (user === '') {
                icon.textContent = '';
                icon.style.color = '';
            } else if (isCorrect) {
                icon.textContent = '✅';
                icon.style.color = '#1f7a3a';
                correctCount++;
            } else {
                icon.textContent = '❌';
                icon.style.color = '#b34a4a';
            }

            // Формируем строку для отчёта (без правильного ответа)
            const num = id.replace('subj', '');
            const displayUser = user || '(пусто)';
            const mark = isCorrect ? '✅' : '❌';
            const className = isCorrect ? 'correct' : 'wrong';
            html += `<div class="answer-row"><span class="${className}">${mark} ${num}. → ${displayUser}</span></div>`;
        }

        // Итог
        html += `<br><strong>Правильно: ${correctCount} из ${total}</strong>`;
        if (correctCount < total) {
            html += `<br><span style="color:#b34a4a;">📘 Некоторые формы неверны. Попробуйте ещё раз.</span>`;
        } else {
            html += `<br><span style="color:#1f7a3a;">🎉 ¡Perfecto! Has dominado el subjuntivo con gustos y deseos.</span>`;
        }
        html += '</div>';

        feedback.innerHTML = html;
        feedback.classList.add('show');
    }

    // Кнопка показа всех правильных ответов (только список, без проверки)
    function showAllAnswers() {
        const feedbackDiv = document.getElementById('subj-feedback');
        let html = '<div class="feedback show"><strong>📋 Все правильные формы (справочник):</strong><br>';
        for (const [id, correct] of Object.entries(correctForms)) {
            const num = id.replace('subj', '');
            html += `<div class="answer-row">${num}. → <strong>${correct}</strong></div>`;
        }
        html += '</div>';
        feedbackDiv.innerHTML = html;
        feedbackDiv.classList.add('show');
    }
</script>
</body>
</html>
